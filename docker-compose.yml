services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: flags
      POSTGRES_PASSWORD: flags
      POSTGRES_DB: flags
    ports:
      # Host port 5433 avoids clashing with a locally installed Postgres on 5432.
      # Containers still reach it as postgres:5432 on the compose network.
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flags -d flags"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # One-shot: applies pending Drizzle migrations, then exits.
  # Re-running is safe — applied migrations are tracked in __drizzle_migrations.
  migrate:
    build:
      context: .
      dockerfile: packages/api/Dockerfile
    command: ["node", "dist/db/migrate.js"]
    environment:
      DATABASE_URL: postgres://flags:flags@postgres:5432/flags
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  # One-shot: creates (or re-syncs) the single admin, then exits. Runs on every
  # `up` so a clean clone reaches a working login with no manual step. Note that
  # seedAdmin upserts: it rotates the password to ADMIN_PASSWORD each time, which
  # makes a forgotten password recoverable without SQL, but also means a password
  # changed elsewhere does not survive the next `up`.
  seed:
    build:
      context: .
      dockerfile: packages/api/Dockerfile
    command: ["node", "dist/db/seed.js"]
    environment:
      DATABASE_URL: postgres://flags:flags@postgres:5432/flags
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-change-me-please}
      # See the api service below.
      ALLOW_DEV_CREDENTIALS: ${ALLOW_DEV_CREDENTIALS:-true}
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"

  api:
    build:
      context: .
      dockerfile: packages/api/Dockerfile
    command: ["node", "dist/index.js"]
    ports:
      - "4000:4000"
    environment:
      PORT: 4000
      DATABASE_URL: postgres://flags:flags@postgres:5432/flags
      REDIS_URL: redis://redis:6379
      # This file is committed, so the values written inline below are PUBLIC.
      # They are not secrets: they exist only so a clean clone starts with no
      # configuration at all.
      #
      # DO NOT put a real secret in this file. Every ${VAR:-default} below reads
      # VAR from `.env` in THIS directory (compose does that automatically) or
      # from your shell, and falls back to the public default only if neither
      # supplies it. So real secrets go in ./.env, which is gitignored — see
      # .env.example, and the README's "Credentials" section.
      #
      # Note `./.env` is NOT packages/api/.env: that one is read by dotenv when
      # the API runs on the host, and compose never looks at it.
      #
      # ALLOW_DEV_CREDENTIALS is what keeps the public defaults safe: without it
      # the API refuses to start on any of them, so a deployment cannot inherit
      # them by forgetting to set something. Once you supply real values, set
      # ALLOW_DEV_CREDENTIALS=false in ./.env to have this stack enforce that too.
      ALLOW_DEV_CREDENTIALS: ${ALLOW_DEV_CREDENTIALS:-true}
      JWT_SECRET: ${JWT_SECRET:-dev-only-jwt-secret-change-me-at-least-32-chars}
      JWT_EXPIRES_IN_SECONDS: ${JWT_EXPIRES_IN_SECONDS:-3600}
      SDK_API_KEY: ${SDK_API_KEY:-dev-only-sdk-api-key-change-me}
      INTEGRATION_API_KEY: ${INTEGRATION_API_KEY:-dev-only-integration-key-change-me}
      FLAG_CACHE_TTL_SECONDS: ${FLAG_CACHE_TTL_SECONDS:-30}
      FLAG_FALLBACK_POLICY: ${FLAG_FALLBACK_POLICY:-fail-closed}
      FLAG_EVAL_LOG_SAMPLE_RATE: ${FLAG_EVAL_LOG_SAMPLE_RATE:-1}
      # Read only by `node dist/db/seed.js`, not by the running API.
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-change-me-please}
    depends_on:
      seed:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Load and chaos testing. Not started by a normal `docker compose up` — it
  # sits behind a profile, and runs on the compose network so measurements do
  # not include Docker Desktop's host port proxy.
  k6:
    image: grafana/k6:latest
    profiles: ["load"]
    volumes:
      - ./k6:/scripts
    environment:
      API_URL: http://api:4000
      SDK_API_KEY: ${SDK_API_KEY:-dev-only-sdk-api-key-change-me}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-change-me-please}
      LOAD_RATE: ${LOAD_RATE:-500}
      LOAD_DURATION: ${LOAD_DURATION:-60s}
      SUMMARY_NAME: ${SUMMARY_NAME:-}
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
